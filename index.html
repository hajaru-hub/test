<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Inventory Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --sp-purple: #6b469b;
      --text-main: #0f172a;
      --text-muted: #475569;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-main);
      padding: 20px;
      margin: 0;
    }

    .dashboard-card {
      background: rgba(248, 249, 252, 0.75);
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 8px 30px 0 rgba(107, 70, 155, 0.06);
      padding: 20px;
      height: 100%;
    }

    .filter-group { flex: 1; min-width: 150px; }
    .filter-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-select, .form-control { background: #fff; border-radius: 10px; border: 1px solid rgba(107, 70, 155, 0.18); padding: 7px 12px; font-size: 0.88rem; font-weight: 600; }
    
    .btn-reset {
      background: linear-gradient(135deg, #6b469b 0%, #4a2e71 100%);
      color: #fff; font-weight: 600; font-size: 0.75rem; border-radius: 10px; padding: 9px 20px; border: none;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, #593983 0%, #3d255e 100%);
      color: #fff;
    }

    .kpi-title { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-family: 'Lora', Georgia, serif; font-size: 1.85rem; font-weight: 700; margin-top: 8px; }

    .border-accent-purple { border-left: 5px solid #6b469b !important; }
    .border-accent-orange { border-left: 5px solid #ea580c !important; }
    .border-accent-teal   { border-left: 5px solid #0d9488 !important; }
    .border-accent-indigo { border-left: 5px solid #4f46e5 !important; }

    .chart-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 14px; }
    .chart-container { position: relative; width: 100%; height: 200px; }

    #debug-status { font-size: 0.8rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; }
    .status-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .status-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <div class="container-fluid px-0">
    <div id="debug-status" class="status-info">Connecting to GitHub Pages dataset...</div>

    <!-- Filters -->
    <div class="dashboard-card mb-3">
      <div class="d-flex align-items-end justify-content-between flex-wrap gap-3">
        <div class="filter-group">
          <div class="filter-label">Search Asset Name</div>
          <input type="text" id="filter-search" class="form-control" placeholder="Type name..." oninput="applyFilters()">
        </div>
        <div class="filter-group">
          <div class="filter-label">Brand</div>
          <select id="filter-brand" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Workbase</div>
          <select id="filter-workbase" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">Status</div>
          <select id="filter-status" class="form-select" onchange="applyFilters()"><option value="All">All</option></select>
        </div>
        <div class="ms-auto">
          <button class="btn btn-reset text-uppercase" onclick="resetFilters()">Reset Filters</button>
        </div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3">
        <div class="dashboard-card border-accent-purple">
          <div class="kpi-title" style="color: #6b469b;">Total Assets</div>
          <div class="kpi-value" id="kpi-total">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="dashboard-card border-accent-orange">
          <div class="kpi-title" style="color: #ea580c;">In Stock</div>
          <div class="kpi-value" id="kpi-instock">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="dashboard-card border-accent-teal">
          <div class="kpi-title" style="color: #0d9488;">In Use</div>
          <div class="kpi-value" id="kpi-inuse">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="dashboard-card border-accent-indigo">
          <div class="kpi-title" style="color: #4f46e5;">Repair</div>
          <div class="kpi-value" id="kpi-repair">0</div>
        </div>
      </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Workbase</div>
          <div class="chart-container"><canvas id="chartWorkbase"></canvas></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Status</div>
          <div class="chart-container"><canvas id="chartStatus"></canvas></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card">
          <div class="chart-title">Company</div>
          <div class="chart-container"><canvas id="chartCompany"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Charts Row 2 -->
    <div class="row g-3">
      <div class="col-12">
        <div class="dashboard-card">
          <div class="chart-title">Brand</div>
          <div class="chart-container" style="height: 220px;"><canvas id="chartBrand"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = { pollIntervalSeconds: 30 };
    const EXECUTIVE_PALETTE = ["#6b469b", "#0284c7", "#0d9488", "#ea580c", "#4f46e5", "#059669", "#d97706", "#475569", "#2563eb", "#b45309"];

    let rawListItems = [];
    let chartWorkbaseInstance = null;
    let chartStatusInstance = null;
    let chartCompanyInstance = null;
    let chartBrandInstance = null;

    function setDebugStatus(msg, type = "info") {
      const el = document.getElementById("debug-status");
      if (el) { el.className = `status-${type}`; el.innerHTML = msg; }
    }

    function parseFieldValue(val) {
      if (val === null || val === undefined) return "Unknown";
      if (typeof val === 'object' && val.Value) return val.Value;
      if (typeof val === 'object' && val.results) return val.results.join(', ');
      const str = String(val).trim();
      return str === "" ? "Unknown" : str;
    }

    async function fetchLocalData() {
      setDebugStatus("Fetching live data from GitHub Pages...", "info");
      
      // Target your specific repository endpoint
      const DATA_URL = `https://hajaru-hub.github.io/test/data.json?t=${Date.now()}`;
      
      const response = await fetch(DATA_URL, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: Unable to fetch data.json`);
      }
      const raw = await response.json();
      
      // Unrolls array if wrapped inside {"data": [...]} or {"value": [...]}
      if (Array.isArray(raw)) return raw;
      if (raw.data && Array.isArray(raw.data)) return raw.data;
      if (raw.value && Array.isArray(raw.value)) return raw.value;
      return [];
    }

    async function loadData() {
      try {
        const items = await fetchLocalData();

        if (items.length === 0) {
          setDebugStatus("Connected successfully, but <strong>0 items</strong> were found in data.json.", "error");
        } else {
          setDebugStatus(`Connected! Successfully loaded <strong>${items.length} items</strong> from GitHub Pages.`, "success");
        }

        rawListItems = items.map(item => ({
          ID: item.ID || item.Id,
          Model: parseFieldValue(item.Title || item.Model),
          Company: parseFieldValue(item.Company),
          Brand: parseFieldValue(item.Brand),
          Workbase: parseFieldValue(item.Workbase),
          Status: parseFieldValue(item.Status)
        }));

        populateFilterDropdowns(rawListItems);
        applyFilters();
      } catch (error) {
        console.error(error);
        setDebugStatus(`<strong>Connection Error:</strong> ${error.message}. Ensure GitHub Actions has pushed data.json to your repository.`, "error");
      }
    }

    function populateFilterDropdowns(items) {
      const bSel = document.getElementById("filter-brand"), wSel = document.getElementById("filter-workbase"), sSel = document.getElementById("filter-status");
      const cB = bSel.value, cW = wSel.value, cS = sSel.value;
      const brands = ["All", ...new Set(items.map(i => i.Brand))].sort();
      const workbases = ["All", ...new Set(items.map(i => i.Workbase))].sort();
      const statuses = ["All", ...new Set(items.map(i => i.Status))].sort();

      bSel.innerHTML = brands.map(b => `<option value="${b}">${b}</option>`).join("");
      wSel.innerHTML = workbases.map(w => `<option value="${w}">${w}</option>`).join("");
      sSel.innerHTML = statuses.map(s => `<option value="${s}">${s}</option>`).join("");

      if (brands.includes(cB)) bSel.value = cB;
      if (workbases.includes(cW)) wSel.value = cW;
      if (statuses.includes(cS)) sSel.value = cS;
    }

    function applyFilters() {
      const searchVal = document.getElementById("filter-search").value.toLowerCase().trim();
      const bVal = document.getElementById("filter-brand").value;
      const wVal = document.getElementById("filter-workbase").value;
      const sVal = document.getElementById("filter-status").value;

      const filtered = rawListItems.filter(item => {
        const nameMatch = !searchVal || item.Model.toLowerCase().includes(searchVal);
        const bMatch = bVal === "All" || item.Brand === bVal;
        const wMatch = wVal === "All" || item.Workbase === wVal;
        const sMatch = sVal === "All" || item.Status === sVal;
        return nameMatch && bMatch && wMatch && sMatch;
      });

      updateKPIs(filtered);
      if (typeof Chart !== 'undefined') renderCharts(filtered);
    }

    function resetFilters() {
      document.getElementById("filter-search").value = "";
      document.getElementById("filter-brand").value = "All";
      document.getElementById("filter-workbase").value = "All";
      document.getElementById("filter-status").value = "All";
      applyFilters();
    }

    function updateKPIs(items) {
      document.getElementById("kpi-total").innerText = items.length;
      document.getElementById("kpi-instock").innerText = items.filter(i => ["in stock", "instock", "available"].includes(i.Status.toLowerCase())).length;
      document.getElementById("kpi-inuse").innerText = items.filter(i => ["in use", "inuse", "assigned"].includes(i.Status.toLowerCase())).length;
      document.getElementById("kpi-repair").innerText = items.filter(i => ["repair", "under repair", "in repair", "faulty"].includes(i.Status.toLowerCase())).length;
    }

    function countByProperty(items, prop) {
      return items.reduce((acc, curr) => { const v = curr[prop] || "Unknown"; acc[v] = (acc[v] || 0) + 1; return acc; }, {});
    }

    function renderCharts(items) {
      const labelFont = { family: "'Segoe UI', sans-serif", size: 11, weight: "600" };
      const numberFont = { family: "'Lora', Georgia, serif", size: 11, weight: "600" };

      const wbCounts = countByProperty(items, "Workbase");
      const ctxWb = document.getElementById("chartWorkbase").getContext("2d");
      if (chartWorkbaseInstance) chartWorkbaseInstance.destroy();
      chartWorkbaseInstance = new Chart(ctxWb, { type: "pie", data: { labels: Object.keys(wbCounts), datasets: [{ data: Object.values(wbCounts), backgroundColor: EXECUTIVE_PALETTE.slice(0, Object.keys(wbCounts).length), borderWidth: 2, borderColor: '#ffffff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: { font: labelFont, color: "#0f172a" } } } } });

      const statusCounts = countByProperty(items, "Status");
      const ctxStatus = document.getElementById("chartStatus").getContext("2d");
      if (chartStatusInstance) chartStatusInstance.destroy();
      chartStatusInstance = new Chart(ctxStatus, { type: "bar", data: { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: "#ea580c", borderRadius: 6 }] }, options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { stepSize: 1, font: numberFont, color: "#475569" }, grid: { color: "rgba(107, 70, 155, 0.08)" } }, y: { ticks: { font: labelFont, color: "#0f172a" }, grid: { display: false } } } } });

      const compCounts = countByProperty(items, "Company");
      const ctxComp = document.getElementById("chartCompany").getContext("2d");
      if (chartCompanyInstance) chartCompanyInstance.destroy();
      chartCompanyInstance = new Chart(ctxComp, { type: "doughnut", data: { labels: Object.keys(compCounts), datasets: [{ data: Object.values(compCounts), backgroundColor: EXECUTIVE_PALETTE.slice(0, Object.keys(compCounts).length), borderWidth: 2, borderColor: '#ffffff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: { font: labelFont, color: "#0f172a" } } } } });

      const brandCounts = countByProperty(items, "Brand");
      const ctxBrand = document.getElementById("chartBrand").getContext("2d");
      if (chartBrandInstance) chartBrandInstance.destroy();
      chartBrandInstance = new Chart(ctxBrand, { type: "bar", data: { labels: Object.keys(brandCounts), datasets: [{ data: Object.values(brandCounts), backgroundColor: "#6b469b", borderRadius: 6 }] }, options: { indexAxis: "x", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { stepSize: 1, font: numberFont, color: "#475569" }, grid: { color: "rgba(107, 70, 155, 0.08)" } }, x: { ticks: { font: labelFont, color: "#0f172a" }, grid: { display: false } } } } });
    }

    window.onload = () => {
      loadData();
      setInterval(loadData, CONFIG.pollIntervalSeconds * 1000);
    };
  </script>
</body>
</html>

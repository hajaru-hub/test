<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Inventory Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #f5f7fb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      padding: 12px;
      font-size: 0.8rem;
    }

    /* Glassmorphism Container */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 12px rgba(149, 157, 165, 0.08);
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .filter-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #6c757d;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .btn-reset {
      background-color: #5c3882;
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      padding: 5px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .btn-reset:hover {
      background-color: #4a2d6b;
      color: #fff;
    }

    /* KPI Cards Styling */
    .kpi-card {
      border-left: 4px solid transparent;
      padding: 10px 14px;
    }

    .kpi-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .kpi-total { border-left-color: #6f42c1; }
    .kpi-total .kpi-title { color: #6f42c1; }

    .kpi-stock { border-left-color: #fd7e14; }
    .kpi-stock .kpi-title { color: #fd7e14; }

    .kpi-use { border-left-color: #20c997; }
    .kpi-use .kpi-title { color: #20c997; }

    .kpi-repair { border-left-color: #6610f2; }
    .kpi-repair .kpi-title { color: #6610f2; }

    .chart-container {
      position: relative;
      height: 180px;
      width: 100%;
    }

    /* Scrollable Data Table */
    .table-responsive {
      max-height: 220px;
      overflow-y: auto;
    }

    .table {
      font-size: 0.75rem;
      margin-bottom: 0;
    }

    .table thead th {
      position: sticky;
      top: 0;
      background-color: #f1ecf7;
      color: #5c3882;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.65rem;
      border-bottom: 2px solid #ddd;
      z-index: 1;
    }

    .badge-status {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .error-banner {
      background-color: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 12px;
      display: none;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container-fluid p-0">
    <!-- Error Notification -->
    <div id="errorBanner" class="error-banner"></div>

    <!-- Filter Section with Asset Name Search -->
    <div class="glass-card">
      <div class="row align-items-end g-2">
        <div class="col-md-3">
          <div class="filter-label">Search Asset Name</div>
          <input type="text" id="filterSearchName" class="form-control form-control-sm" placeholder="Type name or keyword...">
        </div>
        <div class="col-md-3">
          <div class="filter-label">Brand</div>
          <select id="filterBrand" class="form-select form-select-sm">
            <option value="All">All</option>
          </select>
        </div>
        <div class="col-md-2">
          <div class="filter-label">Workbase</div>
          <select id="filterWorkbase" class="form-select form-select-sm">
            <option value="All">All</option>
          </select>
        </div>
        <div class="col-md-2">
          <div class="filter-label">Status</div>
          <select id="filterStatus" class="form-select form-select-sm">
            <option value="All">All</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="btnReset" class="btn btn-reset w-100">Reset Filters</button>
        </div>
      </div>
    </div>

    <!-- KPI Metrics Row -->
    <div class="row g-2 mb-2">
      <div class="col-md-3">
        <div class="glass-card kpi-card kpi-total mb-0">
          <div class="kpi-title">Total Assets</div>
          <div id="kpiTotal" class="kpi-value">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card kpi-card kpi-stock mb-0">
          <div class="kpi-title">In Stock</div>
          <div id="kpiStock" class="kpi-value">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card kpi-card kpi-use mb-0">
          <div class="kpi-title">In Use</div>
          <div id="kpiUse" class="kpi-value">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass-card kpi-card kpi-repair mb-0">
          <div class="kpi-title">Repair</div>
          <div id="kpiRepair" class="kpi-value">0</div>
        </div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-2 mb-2">
      <div class="col-md-4">
        <div class="glass-card mb-0">
          <div class="filter-label mb-2">Workbase</div>
          <div class="chart-container">
            <canvas id="chartWorkbase"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="glass-card mb-0">
          <div class="filter-label mb-2">Status Breakdown</div>
          <div class="chart-container">
            <canvas id="chartStatus"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="glass-card mb-0">
          <div class="filter-label mb-2">Company</div>
          <div class="chart-container">
            <canvas id="chartCompany"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Inventory Data Table Section -->
    <div class="glass-card mb-0">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="filter-label mb-0">Asset Inventory Records (<span id="recordCount">0</span>)</div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover table-striped">
          <thead>
            <tr>
              <th>Title / Asset Name</th>
              <th>Brand</th>
              <th>Workbase</th>
              <th>Company</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted">Loading inventory data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let allItems = [];
    let workbaseChartInstance = null;
    let statusChartInstance = null;
    let companyChartInstance = null;

    function getVal(item, field) {
      if (!item) return 'Unknown';
      const val = item[field];
      if (val === null || val === undefined) return 'Unknown';
      if (typeof val === 'object' && val.Value) return val.Value;
      return String(val).trim() || 'Unknown';
    }

    async function loadData() {
      try {
        // Appended timestamp parameter to guarantee cache-busting
        const response = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Unable to load data.json`);
        }
        const data = await response.json();
        allItems = Array.isArray(data) ? data : (data.value || []);
        
        populateDropdowns();
        updateDashboard();
      } catch (err) {
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.innerText = `Error loading data: ${err.message}. Ensure Power Automate has saved data.json in your GitHub repository.`;
      }
    }

    function populateDropdowns() {
      const brands = new Set();
      const workbases = new Set();
      const statuses = new Set();

      allItems.forEach(item => {
        brands.add(getVal(item, 'Brand'));
        workbases.add(getVal(item, 'Workbase'));
        statuses.add(getVal(item, 'Status'));
      });

      fillSelect('filterBrand', Array.from(brands));
      fillSelect('filterWorkbase', Array.from(workbases));
      fillSelect('filterStatus', Array.from(statuses));
    }

    function fillSelect(elementId, values) {
      const select = document.getElementById(elementId);
      select.innerHTML = '<option value="All">All</option>';
      values.sort().forEach(val => {
        if (val !== 'Unknown') {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        }
      });
    }

    function getFilteredData() {
      const searchName = document.getElementById('filterSearchName').value.toLowerCase().trim();
      const selectedBrand = document.getElementById('filterBrand').value;
      const selectedWorkbase = document.getElementById('filterWorkbase').value;
      const selectedStatus = document.getElementById('filterStatus').value;

      return allItems.filter(item => {
        const title = getVal(item, 'Title').toLowerCase();
        const nameMatch = !searchName || title.includes(searchName);
        const brandMatch = selectedBrand === 'All' || getVal(item, 'Brand') === selectedBrand;
        const workbaseMatch = selectedWorkbase === 'All' || getVal(item, 'Workbase') === selectedWorkbase;
        const statusMatch = selectedStatus === 'All' || getVal(item, 'Status') === selectedStatus;

        return nameMatch && brandMatch && workbaseMatch && statusMatch;
      });
    }

    function updateDashboard() {
      const filtered = getFilteredData();

      // KPIs
      document.getElementById('kpiTotal').textContent = filtered.length;
      
      const inStock = filtered.filter(i => getVal(i, 'Status').toLowerCase() === 'in stock').length;
      const inUse = filtered.filter(i => getVal(i, 'Status').toLowerCase() === 'in use').length;
      const repair = filtered.filter(i => {
        const s = getVal(i, 'Status').toLowerCase();
        return s === 'repair' || s === 'under repair';
      }).length;

      document.getElementById('kpiStock').textContent = inStock;
      document.getElementById('kpiUse').textContent = inUse;
      document.getElementById('kpiRepair').textContent = repair;

      // Render Charts
      renderChart('chartWorkbase', 'Workbase', filtered, instance => workbaseChartInstance = instance, workbaseChartInstance, 'bar');
      renderChart('chartStatus', 'Status', filtered, instance => statusChartInstance = instance, statusChartInstance, 'doughnut');
      renderChart('chartCompany', 'Company', filtered, instance => companyChartInstance = instance, companyChartInstance, 'bar');

      // Populate Table
      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('inventoryTableBody');
      document.getElementById('recordCount').textContent = data.length;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No matching assets found.</td></tr>';
        return;
      }

      let html = '';
      data.forEach(item => {
        const title = getVal(item, 'Title');
        const brand = getVal(item, 'Brand');
        const workbase = getVal(item, 'Workbase');
        const company = getVal(item, 'Company');
        const status = getVal(item, 'Status');

        let badgeClass = 'bg-secondary';
        const stLower = status.toLowerCase();
        if (stLower === 'in stock') badgeClass = 'bg-warning text-dark';
        else if (stLower === 'in use') badgeClass = 'bg-success';
        else if (stLower.includes('repair')) badgeClass = 'bg-danger';

        html += `
          <tr>
            <td class="fw-bold">${title}</td>
            <td>${brand}</td>
            <td>${workbase}</td>
            <td>${company}</td>
            <td><span class="badge ${badgeClass} badge-status">${status}</span></td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function renderChart(canvasId, field, data, setInstance, existingInstance, chartType = 'bar') {
      const counts = {};
      data.forEach(item => {
        const key = getVal(item, field);
        counts[key] = (counts[key] || 0) + 1;
      });

      const labels = Object.keys(counts);
      const values = Object.values(counts);

      if (existingInstance) {
        existingInstance.destroy();
      }

      const palette = [
        '#6f42c1', '#fd7e14', '#20c997', '#6610f2', 
        '#0d6efd', '#ffc107', '#d63384', '#17a2b8'
      ];

      const ctx = document.getElementById(canvasId).getContext('2d');
      const isBar = chartType === 'bar';

      const newChart = new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: 'Count',
            data: values,
            backgroundColor: isBar ? 'rgba(92, 56, 130, 0.75)' : palette.slice(0, labels.length),
            borderColor: isBar ? '#5c3882' : '#ffffff',
            borderWidth: isBar ? 1 : 2,
            borderRadius: isBar ? 4 : 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { 
              display: !isBar,
              position: 'bottom',
              labels: { boxWidth: 8, padding: 8, font: { size: 10 } }
            }
          },
          scales: isBar ? {
            x: { ticks: { font: { size: 10 } } },
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, font: { size: 10 } }
            }
          } : {}
        }
      });

      setInstance(newChart);
    }

    // Event Listeners
    document.getElementById('filterSearchName').addEventListener('input', updateDashboard);
    document.getElementById('filterBrand').addEventListener('change', updateDashboard);
    document.getElementById('filterWorkbase').addEventListener('change', updateDashboard);
    document.getElementById('filterStatus').addEventListener('change', updateDashboard);

    document.getElementById('btnReset').addEventListener('click', () => {
      document.getElementById('filterSearchName').value = '';
      document.getElementById('filterBrand').value = 'All';
      document.getElementById('filterWorkbase').value = 'All';
      document.getElementById('filterStatus').value = 'All';
      updateDashboard();
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
